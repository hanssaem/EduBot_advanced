name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check server syntax
        run: node --check server.js

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:5000
          REACT_APP_FIREBASE_API_KEY: test
          REACT_APP_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: test
          REACT_APP_FIREBASE_STORAGE_BUCKET: test.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          REACT_APP_FIREBASE_APP_ID: test
